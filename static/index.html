<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Ask your notes</title>
<style>
  :root {
    --ink: #eae6da;
    --ink-dim: #a9a495;
    --paper: #14181f;
    --paper-raised: #1b202b;
    --rule: #2a3040;
    --accent: #c9a15c;
    --accent-dim: #7d6a45;
    --serif: Charter, "Iowan Old Style", "Palatino Linotype", Georgia, serif;
    --mono: "SF Mono", "IBM Plex Mono", ui-monospace, Menlo, monospace;
  }

  * { box-sizing: border-box; }

  body {
    margin: 0;
    min-height: 100vh;
    background: var(--paper);
    color: var(--ink);
    font-family: var(--serif);
    display: flex;
    justify-content: center;
    padding: 8vh 24px 10vh;
  }

  main {
    width: 100%;
    max-width: 640px;
  }

  .eyebrow {
    font-family: var(--mono);
    font-size: 12px;
    letter-spacing: 0.14em;
    text-transform: uppercase;
    color: var(--accent-dim);
    margin-bottom: 10px;
  }

  h1 {
    font-size: 34px;
    font-weight: 500;
    margin: 0 0 8px;
    letter-spacing: -0.01em;
  }

  .sub {
    color: var(--ink-dim);
    font-size: 15px;
    margin: 0 0 44px;
    line-height: 1.5;
  }

  form {
    display: flex;
    gap: 10px;
    border-bottom: 1px solid var(--rule);
    padding-bottom: 18px;
  }

  /* --- Source panel --- */
  .panel {
    background: var(--paper-raised);
    border: 1px solid var(--rule);
    border-radius: 10px;
    padding: 20px;
    margin-bottom: 36px;
  }

  .tabs {
    display: flex;
    gap: 4px;
    margin-bottom: 16px;
  }

  .tab-btn {
    font-family: var(--mono);
    font-size: 11px;
    letter-spacing: 0.08em;
    text-transform: uppercase;
    background: transparent;
    color: var(--ink-dim);
    border: 1px solid transparent;
    border-radius: 5px;
    padding: 7px 14px;
    cursor: pointer;
  }

  .tab-btn.active {
    color: var(--accent);
    border-color: var(--accent-dim);
    background: rgba(201, 161, 92, 0.08);
  }

  .tab-panel { display: none; }
  .tab-panel.active { display: block; }

  .drop-zone {
    border: 1px dashed var(--rule);
    border-radius: 8px;
    padding: 22px;
    text-align: center;
    cursor: pointer;
    transition: border-color 0.15s ease;
  }

  .drop-zone:hover, .drop-zone.dragover {
    border-color: var(--accent-dim);
  }

  .drop-zone-label {
    font-size: 15px;
    color: var(--ink);
  }

  .drop-zone-hint {
    font-family: var(--mono);
    font-size: 11px;
    color: var(--ink-dim);
    margin-top: 6px;
  }

  #file-input { display: none; }

  .url-row {
    display: flex;
    gap: 10px;
  }

  .url-row input[type="url"] {
    flex: 1;
    background: transparent;
    border: 1px solid var(--rule);
    border-radius: 6px;
    outline: none;
    color: var(--ink);
    font-family: var(--serif);
    font-size: 15px;
    padding: 10px 12px;
  }

  .url-row input[type="url"]:focus { border-color: var(--accent-dim); }

  .ingest-status {
    font-family: var(--mono);
    font-size: 12px;
    color: var(--ink-dim);
    margin-top: 12px;
    min-height: 16px;
  }

  .ingest-status.error { color: #d98c6c; }
  .ingest-status.success { color: var(--accent); }

  .source-list {
    margin-top: 18px;
    padding-top: 16px;
    border-top: 1px solid var(--rule);
  }

  .source-list-empty {
    font-family: var(--mono);
    font-size: 12px;
    color: var(--ink-dim);
  }

  .source-item {
    display: flex;
    align-items: center;
    justify-content: space-between;
    padding: 7px 0;
    font-size: 14px;
  }

  .source-name {
    color: var(--ink);
    overflow: hidden;
    text-overflow: ellipsis;
    white-space: nowrap;
  }

  .source-remove {
    font-family: var(--mono);
    font-size: 11px;
    color: var(--ink-dim);
    background: transparent;
    border: none;
    cursor: pointer;
    padding: 2px 6px;
    flex-shrink: 0;
  }

  .source-remove:hover { color: #d98c6c; }
  /* --- End source panel --- */

  input[type="text"] {
    flex: 1;
    background: transparent;
    border: none;
    outline: none;
    color: var(--ink);
    font-family: var(--serif);
    font-size: 19px;
    padding: 6px 2px;
  }

  input[type="text"]::placeholder {
    color: var(--ink-dim);
    opacity: 0.7;
  }

  button {
    font-family: var(--mono);
    font-size: 12px;
    letter-spacing: 0.08em;
    text-transform: uppercase;
    background: transparent;
    color: var(--accent);
    border: 1px solid var(--accent-dim);
    border-radius: 4px;
    padding: 0 18px;
    cursor: pointer;
    transition: background 0.15s ease, color 0.15s ease;
  }

  button:hover:not(:disabled) {
    background: var(--accent);
    color: var(--paper);
  }

  button:disabled {
    opacity: 0.4;
    cursor: default;
  }

  #answer-wrap {
    margin-top: 40px;
    min-height: 40px;
  }

  .state-label {
    font-family: var(--mono);
    font-size: 11px;
    letter-spacing: 0.1em;
    text-transform: uppercase;
    color: var(--accent-dim);
    margin-bottom: 14px;
    display: flex;
    align-items: center;
    gap: 8px;
  }

  .dot {
    width: 5px;
    height: 5px;
    border-radius: 50%;
    background: var(--accent);
    animation: pulse 1.1s ease-in-out infinite;
  }

  @keyframes pulse {
    0%, 100% { opacity: 0.3; }
    50% { opacity: 1; }
  }

  .answer {
    font-size: 18px;
    line-height: 1.65;
    color: var(--ink);
    white-space: pre-wrap;
  }

  .answer.error {
    color: #d98c6c;
    font-family: var(--mono);
    font-size: 14px;
  }

  @media (prefers-reduced-motion: reduce) {
    .dot { animation: none; }
  }
</style>
</head>
<body>
  <main>
    <div class="eyebrow">Retrieval-augmented search</div>
    <h1>Ask your notes</h1>
    <p class="sub">Add a PDF, text file, or blog post URL, then ask questions grounded only in what you've added.</p>

    <div class="panel">
      <div class="tabs">
        <button class="tab-btn active" data-tab="file">Upload file</button>
        <button class="tab-btn" data-tab="url">Paste URL</button>
      </div>

      <div class="tab-panel active" id="tab-file">
        <div class="drop-zone" id="drop-zone">
          <div class="drop-zone-label">Click to choose a file, or drag one here</div>
          <div class="drop-zone-hint">.pdf · .txt · .md</div>
        </div>
        <input type="file" id="file-input" accept=".pdf,.txt,.md">
      </div>

      <div class="tab-panel" id="tab-url">
        <div class="url-row">
          <input type="url" id="url-input" placeholder="https://example.com/a-blog-post" autocomplete="off">
          <button type="button" id="url-submit-btn">Add</button>
        </div>
      </div>

      <div class="ingest-status" id="ingest-status"></div>

      <div class="source-list" id="source-list">
        <div class="source-list-empty">Nothing indexed yet.</div>
      </div>
    </div>

    <form id="query-form">
      <input type="text" id="question" placeholder="What do you want to know?" autocomplete="off">
      <button type="submit" id="submit-btn">Ask</button>
    </form>

    <div id="answer-wrap"></div>
  </main>

  <script>
    // ---------- Source management ----------
    const dropZone = document.getElementById('drop-zone');
    const fileInput = document.getElementById('file-input');
    const urlInput = document.getElementById('url-input');
    const urlSubmitBtn = document.getElementById('url-submit-btn');
    const ingestStatus = document.getElementById('ingest-status');
    const sourceList = document.getElementById('source-list');
    const tabBtns = document.querySelectorAll('.tab-btn');
    const tabPanels = document.querySelectorAll('.tab-panel');

    tabBtns.forEach(btn => {
      btn.addEventListener('click', () => {
        tabBtns.forEach(b => b.classList.remove('active'));
        tabPanels.forEach(p => p.classList.remove('active'));
        btn.classList.add('active');
        document.getElementById(`tab-${btn.dataset.tab}`).classList.add('active');
      });
    });

    dropZone.addEventListener('click', () => fileInput.click());
    dropZone.addEventListener('dragover', (e) => { e.preventDefault(); dropZone.classList.add('dragover'); });
    dropZone.addEventListener('dragleave', () => dropZone.classList.remove('dragover'));
    dropZone.addEventListener('drop', (e) => {
      e.preventDefault();
      dropZone.classList.remove('dragover');
      if (e.dataTransfer.files.length) uploadFile(e.dataTransfer.files[0]);
    });
    fileInput.addEventListener('change', () => {
      if (fileInput.files.length) uploadFile(fileInput.files[0]);
    });

    urlSubmitBtn.addEventListener('click', () => {
      const url = urlInput.value.trim();
      if (url) ingestUrl(url);
    });
    urlInput.addEventListener('keydown', (e) => {
      if (e.key === 'Enter') { e.preventDefault(); urlSubmitBtn.click(); }
    });

    function setStatus(message, kind) {
      ingestStatus.textContent = message;
      ingestStatus.className = 'ingest-status' + (kind ? ` ${kind}` : '');
    }

    async function uploadFile(file) {
      setStatus(`Indexing ${file.name} — embedding takes a moment...`);
      const formData = new FormData();
      formData.append('file', file);
      try {
        const res = await fetch('/ingest/file', { method: 'POST', body: formData });
        const data = await res.json();
        if (!res.ok) throw new Error(data.detail || `Server returned ${res.status}`);
        setStatus(`Added ${data.filename} (${data.chunks_added} chunks)`, 'success');
        fileInput.value = '';
        loadSources();
      } catch (err) {
        setStatus(err.message, 'error');
      }
    }

    async function ingestUrl(url) {
      setStatus(`Fetching and indexing ${url} ...`);
      try {
        const res = await fetch('/ingest/url', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ url })
        });
        const data = await res.json();
        if (!res.ok) throw new Error(data.detail || `Server returned ${res.status}`);
        setStatus(`Added ${data.filename} (${data.chunks_added} chunks)`, 'success');
        urlInput.value = '';
        loadSources();
      } catch (err) {
        setStatus(err.message, 'error');
      }
    }

    async function removeSource(filename) {
      try {
        const res = await fetch(`/sources/${encodeURIComponent(filename)}`, { method: 'DELETE' });
        if (!res.ok) throw new Error(`Server returned ${res.status}`);
        loadSources();
      } catch (err) {
        setStatus(err.message, 'error');
      }
    }

    async function loadSources() {
      try {
        const res = await fetch('/sources');
        const data = await res.json();
        if (!data.sources.length) {
          sourceList.innerHTML = '<div class="source-list-empty">Nothing indexed yet.</div>';
          return;
        }
        sourceList.innerHTML = data.sources.map(name => `
          <div class="source-item">
            <span class="source-name">${escapeHtml(name)}</span>
            <button class="source-remove" data-name="${escapeHtml(name)}">Remove</button>
          </div>
        `).join('');
        sourceList.querySelectorAll('.source-remove').forEach(btn => {
          btn.addEventListener('click', () => removeSource(btn.dataset.name));
        });
      } catch (err) {
        sourceList.innerHTML = '<div class="source-list-empty">Couldn\'t load sources.</div>';
      }
    }

    loadSources();

    // ---------- Question / answer ----------
    const form = document.getElementById('query-form');
    const input = document.getElementById('question');
    const btn = document.getElementById('submit-btn');
    const wrap = document.getElementById('answer-wrap');

    form.addEventListener('submit', async (e) => {
      e.preventDefault();
      const question = input.value.trim();
      if (!question) return;

      btn.disabled = true;
      wrap.innerHTML = `
        <div class="state-label"><span class="dot"></span>Searching &amp; thinking</div>
      `;

      try {
        const res = await fetch('/query', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ question })
        });

        if (!res.ok) throw new Error(`Server returned ${res.status}`);

        const data = await res.json();
        wrap.innerHTML = `
          <div class="state-label">Answer</div>
          <div class="answer">${escapeHtml(data.answer)}</div>
        `;
      } catch (err) {
        wrap.innerHTML = `
          <div class="state-label">Something went wrong</div>
          <div class="answer error">${escapeHtml(err.message)}. Is the server running?</div>
        `;
      } finally {
        btn.disabled = false;
      }
    });

    function escapeHtml(str) {
      const div = document.createElement('div');
      div.textContent = str;
      return div.innerHTML;
    }
  </script>
</body>
</html>
